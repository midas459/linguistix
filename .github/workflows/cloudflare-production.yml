name: Linguistix production deployment

on:
  push:
    branches:
      - base44-retirement-cloudflare-supabase
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linguistix-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://linguistix.midas-labs.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: base44-retirement-cloudflare-supabase

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub variable."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL GitHub variable."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY GitHub variable."; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing GEMINI_API_KEY GitHub secret."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check vinext compatibility
        run: npx --yes vinext check

      - name: Lint
        run: npm run lint

      - name: Deploy production Worker
        run: npm run deploy:vinext

      - name: Install production Gemini secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4.130.0 secret put GEMINI_API_KEY --name linguistix

      - name: Smoke-test Kalam Gemini model and API key
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"contents":[{"parts":[{"text":"Reply with exactly KALAM_SMOKE_OK"}]}],"generationConfig":{"maxOutputTokens":24}}' \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent")"
          if [ "$status" != "200" ]; then
            echo "::error::Kalam Gemini smoke test failed with HTTP $status. Provider response is withheld from logs."
            rm -f "$response_file"
            exit 1
          fi
          if ! jq -e '[.candidates[]?.content.parts[]?.text // ""] | join("") | contains("KALAM_SMOKE_OK")' "$response_file" >/dev/null; then
            echo "::error::Gemini returned HTTP 200 but did not return the expected smoke-test text."
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"
          echo "Kalam Gemini model and configured API key passed the smoke test."

      - name: Verify public production site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://linguistix.midas-labs.workers.dev/ || true)"
            if [ "$status" = "200" ]; then
              echo "Production site returned HTTP 200."
              exit 0
            fi
            echo "Waiting for production site (attempt $attempt, HTTP $status)..."
            sleep 10
          done
          echo "::error::Production URL did not return HTTP 200."
          exit 1
