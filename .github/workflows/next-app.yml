name: Next.js migration checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "next-app/**"
      - ".github/workflows/next-app.yml"
      - ".github/workflows/cloudflare-preview.yml"
  push:
    branches:
      - supabase-migration-review
      - base44-retirement-cloudflare-supabase
    paths:
      - "next-app/**"
      - ".github/workflows/next-app.yml"

concurrency:
  group: next-app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Cloudflare vinext compatibility
        run: npx --yes vinext check
      - name: Lint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
      - name: Build Cloudflare Worker output
        run: npm run build:vinext
      - name: Build self-hosted Docker image
        run: docker build --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder -t linguistix-self-hosted:ci .
