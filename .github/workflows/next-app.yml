name: Next.js migration checks

on:
  pull_request:
    paths:
      - "next-app/**"
      - ".github/workflows/next-app.yml"
  push:
    branches:
      - supabase-migration-review
    paths:
      - "next-app/**"
      - ".github/workflows/next-app.yml"

permissions:
  contents: write

concurrency:
  group: next-app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Cloudflare vinext compatibility
        run: npx --yes vinext check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Initialize Cloudflare Workers configuration (no deployment)
        if: ${{ hashFiles('next-app/vite.config.ts') == '' }}
        run: npx --yes vinext init --platform=cloudflare --name=linguistix --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Build Cloudflare Worker output
        run: npm run build:vinext
      - name: Upload generated Cloudflare configuration
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linguistix-cloudflare-config
          path: |
            next-app/package.json
            next-app/package-lock.json
            next-app/vite.config.ts
            next-app/cloudflare.config.ts
            next-app/.gitignore
          if-no-files-found: warn
      - name: Commit generated Cloudflare configuration to this PR branch
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts .gitignore
          if git diff --cached --quiet; then
            echo "Cloudflare configuration is already committed."
          else
            git commit -m "build: add validated Cloudflare Workers configuration"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
