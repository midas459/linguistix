name: Next.js migration checks

on:
  pull_request:
    paths:
      - "next-app/**"
      - ".github/workflows/next-app.yml"
  push:
    branches:
      - supabase-migration-review
    paths:
      - "next-app/**"
      - ".github/workflows/next-app.yml"

jobs:
  next-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
